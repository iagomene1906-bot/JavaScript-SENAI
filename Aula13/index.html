<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/script.js" defer></script>
</head>

<body>
    <h1>Catálogo de Produtos</h1>

    <div class="filtros">
        <input type="text" id="campoBusca" placeholder="Digite para buscar um produto.">

        <select id="ordenacao">
            <option value="nome_az">Nome (A-Z)</option>
            <option value="nome_za">Nome (Z-A)</option>
            <option value="preco_menor">Menor preço</option>
            <option value="preco_maior">Maior preço</option>
        </select>
    </div>

    <div id="listaProdutos" class="lista_produtos"></div>
</body>
</html>
