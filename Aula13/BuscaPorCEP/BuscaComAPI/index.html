<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca CEP</title>
    <link rel="stylesheet" href="Styles/Style.css">
    <script src="Scripts/Script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Buscar endereço pelo CEP</h1>

        <!-- label é semantico, usado para inserir texto ao lado do input -->
        <!-- for associa a label ao input -->
        <label for="cep">CEP:</label>

        <!-- placeholder insere texto dentro do input -->
        <input type="text" id="cep" placeholder="Digite o CEP">
        <button id="botao_buscar">Buscar</button>
        
        <form class="formulario">
            <label for="rua">Rua:</label>
            <input type="text" id="rua" placeholder="Digite a Rua">

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" placeholder="Digite o Bairro">

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" placeholder="Digite a Cidade">

            <label for="estado">Estado:</label>
            <input type="text" id="estado" placeholder="Digite o Estado">
        </form>
    </div>
</body>
</html>
