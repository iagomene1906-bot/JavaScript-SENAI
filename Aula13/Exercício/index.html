<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <script src="Scripts/script.js" defer></script>
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
    <div class="container">
        <h1>Buscar produtos</h1>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite o nome do produto">
        <button id="botao_buscar">Buscar</button>

        <form class="formulario">
            <label for="categoria">Categoria:</label>
            <input type="text" id="categoria" placeholder="Categoria do produto">

            <label for="valor">Valor:</label>
            <input type="text" id="valor" placeholder="Valor do produto">
        </form>
    </div>
</body>
</html>
